<script>
(function(){
  var data = JSON.parse(document.getElementById('rc-data').textContent);
  var KINDS = [['all','全部配方'],['machine','機器配方'],['workbench','進階工作台'],['cooking','互動烹飪']];
  var kind = 'all', q = '';
  var tabs = document.getElementById('rc-tabs');
  var list = document.getElementById('rc-list');
  var cnt  = document.getElementById('rc-count');
  var box  = document.getElementById('rc-q');
  var shown = 60;

  KINDS.forEach(function(k){
    var b = document.createElement('span');
    b.className = 'rc-tab' + (k[0]===kind?' on':'');
    var n = k[0]==='all' ? data.length : data.filter(function(r){return r.kind===k[0];}).length;
    b.textContent = k[1] + ' ' + n;
    b.onclick = function(){ kind = k[0]; shown = 60;
      Array.prototype.forEach.call(tabs.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on'); render(); };
    tabs.appendChild(b);
  });

  function match(r){
    if (kind !== 'all' && r.kind !== kind) return false;
    if (!q) return true;
    var hay = (r.output + ' ' + r.machine + ' ' + r.id + ' ' +
               r.inputs.map(function(i){return i.name;}).join(' ')).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function card(r){
    var d = document.createElement('div');
    d.className = 'rc-card';
    var h = '<div class="rc-out">' + esc(r.output) + (r.count > 1 ? ' ×' + r.count : '') + '</div>';
    h += '<div class="rc-meta">' + esc(r.machine) + (r.energy ? '　⚡ ' + r.energy : '')
                              + (r.guide && r.kind === 'cooking' ? '　⏱ ' + esc(r.guide) : '') + '</div>';
    if (r.shape) {
      h += '<div class="rc-shape">' + r.shape.map(esc).join('\\n') + '</div>';
      h += '<div class="rc-in">' + Object.keys(r.legend).map(function(k){
             return '<span class="rc-chip">' + esc(k) + ' = ' + esc(r.legend[k]) + '</span>'; }).join('') + '</div>';
    } else {
      h += '<div class="rc-in">' + r.inputs.map(function(i){
             var q = i.n > 1 ? ' ×' + i.n : (i.n === 0 ? '（不消耗）' : '');
             return '<span class="rc-chip">' + esc(i.name) + q + '</span>'; }).join('') + '</div>';
    }
    d.innerHTML = h;
    return d;
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function render(){
    var hits = data.filter(match);
    cnt.textContent = hits.length + ' 道配方';
    list.textContent = '';
    hits.slice(0, shown).forEach(function(r){ list.appendChild(card(r)); });
    if (hits.length > shown) {
      var m = document.createElement('div');
      m.className = 'rc-more';
      m.textContent = '還有 ' + (hits.length - shown) + ' 道 —— 點這裡展開';
      m.style.cursor = 'pointer';
      m.onclick = function(){ shown += 200; render(); };
      list.appendChild(m);
    }
  }

  var t;
  box.oninput = function(){ clearTimeout(t); t = setTimeout(function(){
    q = box.value.trim().toLowerCase(); shown = 60; render(); }, 120); };
  render();
})();
</script>
